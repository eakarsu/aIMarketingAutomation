name: governed-marketing-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketing
          POSTGRES_PASSWORD: marketing
          POSTGRES_DB: marketing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketing -d marketing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://marketing:marketing@127.0.0.1:5432/marketing_test?schema=public
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-bytes
      ALLOWED_ORIGINS: http://127.0.0.1:5173
      CONNECTOR_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: npm --prefix backend run db:validate
      - run: npm --prefix backend run db:generate
      - run: npm --prefix backend run db:deploy
      - run: npm --prefix backend run db:deploy
      - run: npm --prefix backend test
      - run: npm --prefix frontend run build
      - name: Reject destructive startup behavior
        run: >-
          ! grep -En '(prisma (db push|migrate reset|migrate dev)|npm (install|ci)|killall|pkill|DROP DATABASE|CREATE DATABASE|seed)' start.sh
